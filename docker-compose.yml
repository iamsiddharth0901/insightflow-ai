services:
  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes: ["./data:/workspace/data"]
  ui:
    build: .
    command: streamlit run ui/app.py --server.address 0.0.0.0
    ports: ["8501:8501"]
    depends_on: [api]
    environment:
      INSIGHTFLOW_API_URL: http://api:8000
